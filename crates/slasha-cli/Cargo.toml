[package]
name = "slasha-cli"
version = "0.0.0"
edition = "2024"
authors = ["slashacom <https://github.com/slashacom/>"]
license = "MIT"
repository = "https://github.com/slashacom/slasha"


[[bin]]
name = "slasha"
path = "src/main.rs"

[features]
# The fully self contained CLI, with the PaaS server, frontend, and all
# required libraries bundled.
default = ["serve", "embed-web", "vendored"]

# Enables the `serve` command in the CLI to run the PaaS server.
# The frontend must be served separately (useful during frontend development)
# enable `embed-web` to bundle the entire frontend into the binary.
serve = ["dep:slasha-server"]

# Embed the frontend into the binary.
embed-web = ["serve", "slasha-server/embed-web"]

# Statically link native dependencies instead of relying on host installed libraries.
vendored = [
    "slasha-db/vendored",
    "slasha-server?/vendored",
]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
colored = "3.1.1"
comfy-table = { version = "7.1.4", features = ["tty", "custom_styling"] }
dirs = "6.0.0"
futures-util = "0.3.32"
indicatif = "0.18.4"
inquire = "0.9.4"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
eventsource-stream = "0.2.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
slasha-db = { path = "../slasha-db" }
slasha-server = { path = "../slasha-server", optional = true }
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-stream = "0.1.18"
keyring = { version = "4.1.2", features = ["v1"] }
toml = "1.1.2"
sysinfo = "0.38.4"
git-version = "0.3.9"
clap_complete = "=4.6.9"
minus = { version = "5.7.2", features = ["static_output", "search"] }
chrono = "0.4.44"

[build-dependencies]
clap = { version = "4.6.0", features = ["derive"] }
chrono = "0.4.44"
